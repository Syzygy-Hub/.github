name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
  workflow_dispatch:

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete Syzygy labels from all Syzygy-Hub repos
        env:
          GH_TOKEN: ${{ secrets.SYZYGY_LABEL_SYNC }}
        run: |
          REPOS=$(gh repo list Syzygy-Hub --limit 100 --json nameWithOwner -q '.[].nameWithOwner')

          for REPO in $REPOS; do
            gh label delete "release"      --repo "$REPO" --yes 2>/dev/null || true
            gh label delete "chore"        --repo "$REPO" --yes 2>/dev/null || true
            gh label delete "dependencies" --repo "$REPO" --yes 2>/dev/null || true
          done
