name: Flutter CI

on:
  workflow_call:
    inputs:
      coverage:
        required: false
        type: boolean
        default: true
        description: 'Whether to run flutter test --coverage and post a summary'
      flutter_version:
        required: false
        type: string
        default: 'stable'
        description: 'Flutter version or channel (stable, beta, or a version like 3.22.0)'
      upload_artifacts:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload coverage/ as a build artifact. Set to false to opt out.'
      # WARNING: Always pass a pinned commit SHA in production.
      # The 'main' default is for local development convenience only.
      # A bad push to the Syzygy-Hub/.github main branch will silently
      # affect all callers that rely on the default.
      org_config_sha:
        required: false
        type: string
        default: 'main'
        description: 'Commit SHA of Syzygy-Hub/.github to fetch tooling configs from. MUST be a pinned SHA in production — the main default is for development convenience only.'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable

      - name: Fetch analysis config
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/Syzygy-Hub/.github/${{ inputs.org_config_sha }}/engineering/tooling/flutter/analysis_options.yaml" \
            -o analysis_options.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test with coverage
        if: ${{ inputs.coverage }}
        run: |
          flutter test --coverage
          echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          if command -v lcov &> /dev/null; then
            lcov --summary coverage/lcov.info 2>&1 | tee coverage-summary.txt
            cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage data generated at \`coverage/lcov.info\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Install lcov to display a line-coverage summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test without coverage
        if: ${{ !inputs.coverage }}
        run: flutter test

      - name: Upload coverage
        if: always() && inputs.upload_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
