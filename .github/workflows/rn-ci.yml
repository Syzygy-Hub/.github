name: React Native CI

on:
  workflow_call:
    inputs:
      coverage:
        required: false
        type: boolean
        default: true
        description: 'Whether to run Jest with coverage and post a summary'
      node_version:
        required: false
        type: string
        default: '20'
        description: 'Node.js version to use'
      eslint_config:
        required: false
        type: string
        default: '.eslintrc.json'
        description: |
          ESLint config filename to fetch from engineering/tooling/rn/.
          Use '.eslintrc.json' for React Native app repos (default).
          Use '.eslintrc.ts.json' for pure TypeScript library repos (e.g. syzygy-foundation-rn).
      upload_artifacts:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload coverage/ as a build artifact. Set to false to opt out.'
      org_config_sha:
        required: false
        type: string
        default: 'main'
        description: 'Ref of Syzygy-Hub/.github to fetch tooling configs from. Defaults to main.'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Fetch ESLint and Prettier configs
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/Syzygy-Hub/.github/${{ inputs.org_config_sha }}/engineering/tooling/rn/${{ inputs.eslint_config }}" \
            -o .eslintrc.json
          curl -fsSL \
            "https://raw.githubusercontent.com/Syzygy-Hub/.github/${{ inputs.org_config_sha }}/engineering/tooling/rn/.prettierrc" \
            -o .prettierrc
          # Remove any local eslintrc.js that would take precedence over the fetched .json
          rm -f .eslintrc.js .eslintrc.cjs

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        if: ${{ inputs.coverage }}
        run: |
          npm test -- --coverage --coverageReporters=text-summary 2>&1 | tee coverage-output.txt
          echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          grep -A 20 "Coverage summary" coverage-output.txt >> "$GITHUB_STEP_SUMMARY" \
            || echo "No coverage summary found — ensure Jest is configured with coverage reporters." >> "$GITHUB_STEP_SUMMARY"

      - name: Test without coverage
        if: ${{ !inputs.coverage }}
        run: npm test

      - name: Upload coverage
        if: always() && inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
