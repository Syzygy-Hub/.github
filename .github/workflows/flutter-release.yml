name: Flutter Release

on:
  workflow_call:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        run: |
          VERSION=$(grep '^version:' syzygy.yml | sed 's/version: //' | tr -d ' ')
          TAG=${{ github.ref_name }}
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::syzygy.yml version ($VERSION) does not match pushed tag ($TAG)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract CHANGELOG entry
        run: |
          awk '/^## \[/{if(found) exit; found=1; next} found' CHANGELOG.md > release_notes.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup pub credentials
        run: |
          mkdir -p $HOME/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > $HOME/.config/dart/pub-credentials.json

      - name: Install dependencies
        run: flutter pub get

      - name: Sync pubspec.yaml version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml

      - name: Publish to pub.dev
        run: flutter pub publish --force

      - name: Wait for pub.dev propagation
        run: |
          PACKAGE_NAME=$(grep '^name:' pubspec.yaml | sed 's/name: //' | tr -d ' ')
          VERSION=${{ steps.version.outputs.VERSION }}
          for i in $(seq 1 30); do
            if curl -s "https://pub.dev/api/packages/$PACKAGE_NAME" | grep -q "\"$VERSION\""; then
              echo "Package $PACKAGE_NAME $VERSION confirmed on pub.dev"
              break
            fi
            echo "Waiting for pub.dev propagation... attempt $i of 30"
            sleep 10
          done
          if ! curl -s "https://pub.dev/api/packages/$PACKAGE_NAME" | grep -q "\"$VERSION\""; then
            echo "::warning::Could not confirm propagation of $PACKAGE_NAME $VERSION on pub.dev after 30 attempts — package was published successfully but pub.dev indexing may still be pending"
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" \
            --title "${{ steps.version.outputs.VERSION }}" \
            --notes-file release_notes.txt \
            --target "${{ github.sha }}"
