name: iOS CI

on:
  workflow_call:
    inputs:
      scheme:
        required: true
        type: string
        description: 'The Swift package name (used to locate test binaries for coverage)'
      coverage:
        required: false
        type: boolean
        default: true
        description: 'Whether to generate a coverage report in the job summary'
      upload_artifacts:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload build/reports/ as a build artifact. Set to false to opt out.'
      # WARNING: Always pass a pinned commit SHA in production.
      # The 'main' default is for local development convenience only.
      # A bad push to the Syzygy-Hub/.github main branch will silently
      # affect all callers that rely on the default.
      org_config_sha:
        required: false
        type: string
        default: 'main'
        description: 'Commit SHA of Syzygy-Hub/.github to fetch tooling configs from. MUST be a pinned SHA in production — the main default is for development convenience only.'

# Coverage note (judgment call 2):
# The test binary path varies by package name and number of targets.
# We use `find .build -name "*.profdata"` to locate profdata dynamically
# rather than hardcoding a path, which handles packages with multiple
# test targets gracefully.

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SwiftLint config
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/Syzygy-Hub/.github/${{ inputs.org_config_sha }}/engineering/tooling/ios/.swiftlint.yml" \
            -o .swiftlint.yml

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint --config .swiftlint.yml

      - name: Build
        run: swift build

      - name: Test with coverage
        if: ${{ inputs.coverage }}
        run: |
          swift test --enable-code-coverage

          # Locate profdata dynamically — works for any package name
          PROFDATA=$(find .build -name "default.profdata" | head -1)
          if [ -z "$PROFDATA" ]; then
            echo "No profdata found — skipping coverage report"
            exit 0
          fi

          # Find all test binaries
          BINARIES=$(find .build/debug -name "*.xctest" -path "*/Contents/MacOS/*" 2>/dev/null | head -5)
          if [ -z "$BINARIES" ]; then
            # SPM on Linux — test binary is a plain executable
            BINARIES=$(find .build/debug -name "*PackageTests" -type f 2>/dev/null | head -1)
          fi

          if [ -n "$BINARIES" ]; then
            echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
            for BIN in $BINARIES; do
              xcrun llvm-cov report "$BIN" \
                -instr-profile "$PROFDATA" \
                --ignore-filename-regex='\.build|Tests' \
                >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            done
          else
            echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage data generated at: $PROFDATA" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test without coverage
        if: ${{ !inputs.coverage }}
        run: swift test

      - name: Upload test artifacts
        if: always() && inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: build/reports/
          if-no-files-found: warn
