name: iOS Release

# Reusable release workflow. Triggered ONLY by callers (workflow_call).
# Tag triggers live in each caller's release.yml, not here.
#
# Flow: validate (tag, syzygy.yml and CHANGELOG checks; contents: read only)
#       -> release (CHANGELOG extraction, GitHub Release, optional website notification).
# SPM needs no publish step: the git tag is the release.
#
# The CI gate is NOT run here. A caller that wants it adds its own 'gate' job that calls
# ci-gate.yml and makes 'release' depend on it (see the commented example in the release templates).

on:
  workflow_call:
    inputs:
      ci_workflow_name:
        description: "No longer used: the CI gate moved to ci-gate.yml. Accepted and ignored so existing callers do not fail."
        type: string
        default: ci.yml
      allow_empty_notes:
        description: Allow a release when CHANGELOG.md has no entry for the version (generic notes are used).
        type: boolean
        default: false
      notify_website_repo:
        description: "Optional owner/repo (e.g. Syzygy-Hub/website). When set and WEBSITE_DISPATCH_TOKEN is passed, a repository_dispatch (event_type syzygy-release) is sent after a successful release. Empty (default) = off."
        type: string
        default: ''
    secrets:
      WEBSITE_DISPATCH_TOKEN:
        required: false

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag and syzygy.yml version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == v* ]]; then
            echo "::error::Tag '$TAG' is v-prefixed. Release tags must be bare semver without a v, e.g. 3.0.0."
            exit 1
          fi
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+[-+] ]]; then
            echo "::error::Tag '$TAG' is a pre-release or has build metadata. Release tags must be strict MAJOR.MINOR.PATCH, e.g. 3.0.0."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not strict semver (MAJOR.MINOR.PATCH, e.g. 3.0.0)."
            exit 1
          fi
          RAW=$(sed -nE 's/^version:(.*)$/\1/p' syzygy.yml | sed -n '1p')
          RAW="${RAW%%#*}"
          RAW="${RAW//[[:space:]]/}"
          RAW="${RAW//\"/}"
          RAW="${RAW//\'/}"
          if [[ -z "$RAW" ]]; then
            echo "::error::No 'version:' found in syzygy.yml."
            exit 1
          fi
          if [[ "$RAW" != "$TAG" ]]; then
            echo "::error::syzygy.yml version ($RAW) does not match pushed tag ($TAG). Both must be exactly the same bare semver."
            exit 1
          fi
          echo "VERSION=$RAW" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract CHANGELOG entry
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ALLOW_EMPTY_NOTES: ${{ inputs.allow_empty_notes }}
        run: |
          set -euo pipefail
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found."
            exit 1
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.txt
          if [[ -z "$(tr -d '[:space:]' < release_notes.txt)" ]]; then
            if [[ "$ALLOW_EMPTY_NOTES" == "true" ]]; then
              echo "::warning::CHANGELOG.md has no non-empty entry for $VERSION; using generic release notes (allow_empty_notes=true)."
              echo "Release $VERSION" > release_notes.txt
            else
              echo "::error::CHANGELOG.md has no entry for $VERSION (or it is empty). Add a '## [$VERSION] - YYYY-MM-DD' section, or set allow_empty_notes: true."
              exit 1
            fi
          fi

      - name: SPM note
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          echo "SPM package available at tag $VERSION"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.txt \
            --target "$GITHUB_SHA"

      - name: Notify website repo (optional, off by default)
        if: ${{ inputs.notify_website_repo != '' }}
        env:
          NOTIFY_REPO: ${{ inputs.notify_website_repo }}
          DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # No errexit: every failure below becomes a warning, never a failed release.
          set +e -uo pipefail
          # Token not passed (no secrets: inherit, or unset): skip silently.
          if [[ -z "$DISPATCH_TOKEN" ]]; then
            exit 0
          fi
          if [[ ! "$NOTIFY_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::warning::notify_website_repo '$NOTIFY_REPO' is not owner/repo. Website notification skipped; the release is not affected."
            exit 0
          fi
          PAYLOAD=$(jq -cn --arg repo "$REPO" --arg tag "$VERSION" --arg version "$VERSION" \
            '{event_type: "syzygy-release", client_payload: {repo: $repo, tag: $tag, version: $version}}')
          if [[ -z "$PAYLOAD" ]]; then
            echo "::warning::Could not build the dispatch payload. Website notification skipped; the release is not affected."
            exit 0
          fi
          CURL_ERR=$(mktemp)
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.github.com/repos/$NOTIFY_REPO/dispatches" 2> "$CURL_ERR")
          CURL_RC=$?
          if [[ $CURL_RC -ne 0 || "$HTTP_CODE" != "204" ]]; then
            ERR_MSG=$(head -c 300 "$CURL_ERR" | tr '\n' ' ')
            echo "::warning::Website notification to $NOTIFY_REPO failed (curl exit $CURL_RC, HTTP ${HTTP_CODE:-none}). $ERR_MSG The release is not affected."
            exit 0
          fi
          echo "Notified $NOTIFY_REPO of release $VERSION (repository_dispatch: syzygy-release)."
