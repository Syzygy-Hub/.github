# Lints every workflow file in this directory with actionlint (pinned release, checksum verified).
# Runs only when files under .github/workflows/ change. Read-only: contents: read only.
# It does not call or change the reusable workflows; it only checks them.

name: Lint workflows

on:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@v7

      - name: Download and verify actionlint
        run: |
          set -euo pipefail
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$BASE/$ARCHIVE" -o "$RUNNER_TEMP/$ARCHIVE"
          curl -fsSL "$BASE/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $ARCHIVE\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color
