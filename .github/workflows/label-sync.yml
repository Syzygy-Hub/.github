name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
  workflow_dispatch:

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove deprecated Syzygy labels from all repos
        env:
          GH_TOKEN: ${{ secrets.SYZYGY_LABEL_SYNC }}
        run: |
          REPOS=$(gh repo list Syzygy-Hub --limit 100 --json nameWithOwner -q '.[].nameWithOwner')
          DEPRECATED=("feature" "fix" "breaking")

          for REPO in $REPOS; do
            for LABEL in "${DEPRECATED[@]}"; do
              gh label delete "$LABEL" --repo "$REPO" --yes 2>/dev/null || true
            done
          done

      - name: Restore GitHub default labels removed by mistake
        env:
          GH_TOKEN: ${{ secrets.SYZYGY_LABEL_SYNC }}
        run: |
          REPOS=$(gh repo list Syzygy-Hub --limit 100 --json nameWithOwner -q '.[].nameWithOwner')

          for REPO in $REPOS; do
            gh label create "documentation" \
              --color "0075ca" \
              --description "Improvements or additions to documentation" \
              --repo "$REPO" \
              --force 2>/dev/null || true
          done

      - name: Sync labels to all Syzygy-Hub repos
        env:
          GH_TOKEN: ${{ secrets.SYZYGY_LABEL_SYNC }}
        run: |
          REPOS=$(gh repo list Syzygy-Hub --limit 100 --json nameWithOwner -q '.[].nameWithOwner')

          while IFS= read -r line; do
            if [[ $line == "- name:"* ]]; then
              NAME="${line#*- name: }"
              NAME="${NAME//\"/}"
            elif [[ $line == "  color:"* ]]; then
              COLOR="${line#*color: }"
              COLOR="${COLOR//\"/}"
            elif [[ $line == "  description:"* ]]; then
              DESC="${line#*description: }"
              DESC="${DESC//\"/}"
              for REPO in $REPOS; do
                gh label create "$NAME" \
                  --color "$COLOR" \
                  --description "$DESC" \
                  --repo "$REPO" \
                  --force 2>/dev/null || true
              done
            fi
          done < .github/labels.yml
