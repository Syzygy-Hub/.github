name: Android CI

on:
  workflow_call:
    inputs:
      coverage:
        required: false
        type: boolean
        default: true
        description: 'Whether to run jacocoTestReport and post a summary'
      java_version:
        required: false
        type: string
        default: '21'
        description: "JDK version to use. Use '17' for library repos (e.g. syzygy-foundation-android), '21' for app repos. Must match the repo's jvmToolchain() setting."
      upload_artifacts:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload build/reports/tests/test as a build artifact. Set to false to opt out.'
      org_config_sha:
        required: false
        type: string
        default: 'main'
        description: 'Ref of Syzygy-Hub/.github to fetch tooling configs from. Defaults to main.'

# JaCoCo note (judgment call 3):
# The `jacocoTestReport` task must exist in the consuming repo's build.gradle.kts.
# This workflow cannot add the JaCoCo plugin — it can only invoke tasks that
# already exist. Consuming repos must add:
#
#   plugins { id("jacoco") }
#   tasks.jacocoTestReport { ... }
#
# to their build.gradle.kts before coverage reporting will work.
# If the task does not exist, the coverage step will fail gracefully with a
# Gradle "task not found" error, not a silent pass.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'temurin'

      - name: Fetch ktlint config
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/Syzygy-Hub/.github/${{ inputs.org_config_sha }}/engineering/tooling/android/.editorconfig" \
            -o .editorconfig

      - name: Build
        run: ./gradlew build

      - name: ktlint check
        run: ./gradlew ktlintCheck

      - name: Test
        run: ./gradlew test

      - name: Upload test results
        if: always() && inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: warn

      - name: Coverage report
        if: ${{ inputs.coverage }}
        run: |
          ./gradlew jacocoTestReport
          echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage report generated at \`app/build/reports/jacoco/\`" >> "$GITHUB_STEP_SUMMARY"
          # Print line coverage summary if the XML report exists
          REPORT=$(find . -name "jacocoTestReport.xml" | head -1)
          if [ -n "$REPORT" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            grep -o 'type="LINE"[^/]*/>' "$REPORT" | head -1 >> "$GITHUB_STEP_SUMMARY" || true
          fi
